[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "guide2build"
version = "0.1.0"
description = "Official-guide reconstruction and Three.js tutorial backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
  "httpx>=0.27,<1", "pypdfium2>=4.30,<6", "Pillow>=11,<13"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "jsonschema>=4.23,<5"]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/guide2build"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
pythonpath = ["apps/api/src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = ["docs/bootstrap/template"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
